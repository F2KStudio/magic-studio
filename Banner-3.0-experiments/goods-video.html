<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:transparent}
body{position:relative;font-family:Arial,sans-serif}
.banner{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:#06182a}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse at 52% 36%,rgba(24,154,205,.68),rgba(4,18,34,.78) 52%,#03070d 100%);background-size:cover;background-position:center;filter:saturate(1.25) contrast(1.08)}
.smoke{position:absolute;inset:-20%;background:radial-gradient(circle at 50% 28%,rgba(0,190,255,.32),transparent 30%),radial-gradient(circle at 64% 48%,rgba(41,210,255,.24),transparent 28%),radial-gradient(circle at 34% 60%,rgba(0,110,180,.24),transparent 32%);filter:blur(24px);animation:smokeMove var(--video-duration,5s) ease-in-out both}
.left-stack{position:absolute;left:44px;top:54px;width:990px;height:560px;z-index:45}
.left-img{position:absolute;object-fit:contain;filter:drop-shadow(0 10px 16px rgba(0,0,0,.78));opacity:0;animation:slideIn 5s cubic-bezier(.18,.8,.22,1) both}
.left1{left:20px!important;top:18px!important;width:330px;height:250px;transform:perspective(420px) rotateY(-16deg) rotateZ(-6deg)}
.left2{left:310px!important;top:12px!important;width:470px;height:250px;animation-delay:.18s}
.left3{left:770px!important;top:42px!important;width:260px;height:180px;animation-delay:.36s}
.figures{position:absolute;left:0;top:660px;width:1080px;height:900px;z-index:35;overflow:visible}
.fig{position:absolute;left:0;top:0;width:620px;height:900px;object-fit:contain;filter:drop-shadow(0 0 10px var(--product-glow,#fff));transform-origin:center bottom;opacity:0;animation:lineDepthMarquee var(--video-duration,8s) linear infinite;will-change:transform,opacity}
.count-1 .fig1{left:170px;top:20px;width:660px;height:1040px}
.count-2 .fig1{left:20px;top:120px;width:560px;height:930px}.count-2 .fig2{left:430px;top:80px;width:580px;height:950px}
.count-3 .fig1{left:-55px;top:220px;width:430px;height:820px}.count-3 .fig2{left:245px;top:38px;width:600px;height:990px}.count-3 .fig3{left:660px;top:220px;width:430px;height:820px}
.count-4 .fig1{left:-60px;top:300px;width:360px;height:720px}.count-4 .fig2{left:160px;top:115px;width:500px;height:890px}.count-4 .fig3{left:500px;top:98px;width:510px;height:900px}.count-4 .fig4{left:740px;top:300px;width:360px;height:720px}
.count-5 .fig1{left:-65px;top:370px;width:310px;height:660px}.count-5 .fig2{left:90px;top:230px;width:420px;height:780px}.count-5 .fig3{left:320px;top:90px;width:550px;height:940px}.count-5 .fig4{left:610px;top:230px;width:420px;height:780px}.count-5 .fig5{left:805px;top:370px;width:310px;height:660px}
.video-text{position:absolute;left:70px;right:70px;bottom:300px;z-index:60;color:#fff;font-family:'Arial Black',Impact,sans-serif;font-size:82px;line-height:1;text-align:center;text-transform:uppercase;letter-spacing:1px;text-shadow:0 6px 0 rgba(0,0,0,.62),0 14px 22px rgba(0,0,0,.45);opacity:0;animation:textIntro .75s ease-out .15s both}
.missing{display:none}
@keyframes slideIn{
  0%{opacity:0;transform:translateX(-180px) scale(.92)}
  18%{opacity:1}
  58%{opacity:1;transform:translateX(26px) scale(1)}
  100%{opacity:1;transform:translateX(0) scale(1)}
}
@keyframes figureReveal{
  0%{opacity:0}
  100%{opacity:1}
}
@keyframes lineDepthMarquee{
  0%{transform:translateX(-720px) scale(calc(var(--item-scale,1) * .72));opacity:0;z-index:20}
  10%{opacity:1}
  38%{transform:translateX(-160px) scale(calc(var(--item-scale,1) * 1.05));opacity:1;z-index:40}
  50%{transform:translateX(230px) scale(calc(var(--item-scale,1) * 1.45));opacity:1;z-index:70}
  62%{transform:translateX(620px) scale(calc(var(--item-scale,1) * 1.05));opacity:1;z-index:40}
  90%{opacity:1}
  100%{transform:translateX(1260px) scale(calc(var(--item-scale,1) * .72));opacity:0;z-index:20}
}
@keyframes textIntro{
  0%{opacity:0;transform:translateY(22px) scale(.96)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes smokeMove{
  0%{transform:translateX(-28px) scale(1.02)}
  100%{transform:translateX(26px) scale(1.06)}
}
</style>
</head>
<body>
<div class="banner">
  <div class="bg"></div>
  <div class="smoke"></div>
  <div class="left-stack">
    <img class="left-img left1" data-src="left1_url">
    <img class="left-img left2" data-src="left2_url">
    <img class="left-img left3" data-src="left3_url">
  </div>
  <div class="figures">
    <img class="fig fig1" data-src="figure1_url">
    <img class="fig fig2" data-src="figure2_url">
    <img class="fig fig3" data-src="figure3_url">
    <img class="fig fig4" data-src="figure4_url">
    <img class="fig fig5" data-src="figure5_url">
  </div>
  <div class="video-text" id="videoText"></div>
</div>
<script>
const p = new URLSearchParams(window.location.search);
const g = key => p.get(key) || '';
const count = Math.max(1, Math.min(5, Number(g('figure_count') || 3)));
const figureBox = document.querySelector('.figures');
figureBox.classList.add('count-' + count);
const videoDuration = count === 1 ? 4.2 : Math.max(7, count * 1.55);
document.documentElement.style.setProperty('--video-duration', videoDuration + 's');
const bgUrl = g('bg_url');
if (bgUrl) document.querySelector('.bg').style.backgroundImage = "url('" + bgUrl + "')";
else document.querySelector('.bg').style.backgroundColor = g('fallback_bg') || '#06233a';
document.getElementById('videoText').textContent = g('series_text') || 'Série maintenant disponible !';
document.documentElement.style.setProperty('--product-glow', g('product_glow') || '#ffffff');
document.querySelectorAll('img[data-src]').forEach(img => {
  const key = img.getAttribute('data-src');
  const url = g(key);
  if (/left([1-3])_url/.test(key) && g('show_left' + key.match(/left([1-3])_url/)[1]) === '0') {
    img.classList.add('missing');
    return;
  }
  if (!url || (/figure([1-5])_url/.test(key) && Number(key.match(/figure([1-5])_url/)[1]) > count)) {
    img.classList.add('missing');
    return;
  }
  img.src = url;
});
function applyProductControls() {
  const originals = [];
  for (let i = 1; i <= 5; i++) {
    const img = document.querySelector('.fig' + i);
    if (!img || img.classList.contains('missing')) continue;
    originals.push({img, i});
  }
  const productWidth = originals.length === 1 ? 650 : 620;
  const productHeight = originals.length === 1 ? 900 : 900;

  if (originals.length === 1) {
    const {img, i} = originals[0];
    const size = Number(g('product' + i + '_size') || 118) / 100;
    const x = Number(g('product' + i + '_x') || 0);
    const y = Number(g('product' + i + '_y') || 0);
    const z = Number(g('product' + i + '_z') || (20 + i));
    img.style.left = ((1080 - productWidth) / 2 + x) + 'px';
    img.style.top = (80 + y) + 'px';
    img.style.width = productWidth + 'px';
    img.style.height = productHeight + 'px';
    img.style.transform = 'scale(' + size + ')';
    img.style.zIndex = z;
    img.style.animation = 'figureReveal .55s ease-out .2s both';
    return;
  }

  originals.forEach(({img, i}, index) => {
    const size = Number(g('product' + i + '_size') || 118) / 100;
    const x = Number(g('product' + i + '_x') || 0);
    const y = Number(g('product' + i + '_y') || 0);
    const z = Number(g('product' + i + '_z') || (20 + i));
    img.style.left = x + 'px';
    img.style.top = y + 'px';
    img.style.width = productWidth + 'px';
    img.style.height = productHeight + 'px';
    img.style.setProperty('--item-scale', size);
    img.style.zIndex = z;
    img.style.animation = 'lineDepthMarquee var(--video-duration,8s) linear ' + (-index * (videoDuration / originals.length)) + 's infinite';
  });
}
applyProductControls();
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1562px;height:395px;overflow:hidden;background:transparent}
body{position:relative;font-family:Arial,sans-serif}
.banner{position:absolute;left:10px;top:8px;width:1542px;height:379px;overflow:visible;background:transparent}
.frame{position:absolute;left:0;right:0;top:0;bottom:34px;border-radius:44px;overflow:hidden;background:#06182a;box-shadow:0 8px 26px rgba(0,0,0,.45)}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse at 55% 42%,rgba(21,139,186,.65),rgba(4,18,34,.76) 48%,#03070d 100%);background-size:cover;background-position:center;filter:saturate(1.22) contrast(1.06)}
.smoke{position:absolute;inset:-20%;background:radial-gradient(circle at 45% 40%,rgba(0,190,255,.28),transparent 28%),radial-gradient(circle at 70% 55%,rgba(41,210,255,.22),transparent 30%),radial-gradient(circle at 35% 72%,rgba(0,110,180,.2),transparent 26%);filter:blur(14px)}
.left-stack{position:absolute;left:18px;top:14px;width:610px;height:360px;z-index:20}
.left-img{position:absolute;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,.78))}
.left1{left:-8px;top:-6px;width:310px;height:220px;transform:perspective(360px) rotateY(-16deg) rotateZ(-6deg);transform-origin:center center}
.left2{left:122px;top:-4px;width:540px;height:208px}
.left3{left:14px;top:218px;width:410px;height:106px}
.figures{position:absolute;left:440px;top:18px;width:1070px;height:440px;z-index:30}
.fig{position:absolute;object-fit:contain;filter:drop-shadow(0 0 7px var(--product-glow,#fff));transform-origin:center bottom}
.count-1 .fig1{left:230px;top:-58px;width:610px;height:525px}
.count-2 .fig1{left:160px;top:-44px;width:530px;height:500px}.count-2 .fig2{left:455px;top:-48px;width:540px;height:505px}
.count-3 .fig1{left:90px;top:-14px;width:450px;height:455px}.count-3 .fig2{left:335px;top:-62px;width:540px;height:520px}.count-3 .fig3{left:650px;top:-18px;width:455px;height:465px}
.count-4 .fig1{left:40px;top:-2px;width:365px;height:420px}.count-4 .fig2{left:250px;top:-42px;width:435px;height:465px}.count-4 .fig3{left:510px;top:-48px;width:455px;height:470px}.count-4 .fig4{left:755px;top:-2px;width:365px;height:420px}
.count-5 .fig1{left:35px;top:12px;width:330px;height:405px}.count-5 .fig2{left:205px;top:-24px;width:395px;height:450px}.count-5 .fig3{left:405px;top:-62px;width:470px;height:495px}.count-5 .fig4{left:655px;top:-22px;width:395px;height:450px}.count-5 .fig5{left:850px;top:12px;width:330px;height:405px}
.missing{display:none}
</style>
</head>
<body>
<div class="banner">
  <div class="frame">
    <div class="bg"></div>
  <div class="smoke"></div>
  </div>
  <div class="left-stack">
    <img class="left-img left1" data-src="left1_url">
    <img class="left-img left2" data-src="left2_url">
    <img class="left-img left3" data-src="left3_url">
  </div>
  <div class="figures">
    <img class="fig fig1" data-src="figure1_url">
    <img class="fig fig2" data-src="figure2_url">
    <img class="fig fig3" data-src="figure3_url">
    <img class="fig fig4" data-src="figure4_url">
    <img class="fig fig5" data-src="figure5_url">
  </div>
</div>
<script>
const p = new URLSearchParams(window.location.search);
const g = key => p.get(key) || '';
const count = Math.max(1, Math.min(5, Number(g('figure_count') || 3)));
document.querySelector('.figures').classList.add('count-' + count);
const bgUrl = g('bg_url');
if (bgUrl) document.querySelector('.bg').style.backgroundImage = "url('" + bgUrl + "')";
else document.querySelector('.bg').style.backgroundImage = 'linear-gradient(135deg,' + (g('fallback_bg') || '#06233a') + ',' + (g('fallback_bg2') || '#2f80c9') + ')';
document.querySelectorAll('img[data-src]').forEach(img => {
  const key = img.getAttribute('data-src');
  const url = g(key);
  if (/left([1-3])_url/.test(key) && g('show_left' + key.match(/left([1-3])_url/)[1]) === '0') {
    img.classList.add('missing');
    return;
  }
  if (!url || (/figure([1-5])_url/.test(key) && Number(key.match(/figure([1-5])_url/)[1]) > count)) {
    img.classList.add('missing');
    return;
  }
  img.src = url;
});
document.documentElement.style.setProperty('--product-glow', g('product_glow') || '#ffffff');
function applyLeftControls() {
  for (let i = 1; i <= 3; i++) {
    const img = document.querySelector('.left' + i);
    if (!img || img.classList.contains('missing')) continue;
    const size = Number(g('left' + i + '_size') || 100) / 100;
    const x = Number(g('left' + i + '_x') || 0);
    const y = Number(g('left' + i + '_y') || 0);
    const rot = Number(g('left' + i + '_rot') || 0);
    img.style.transform = i === 1
      ? 'translate(' + x + 'px,' + y + 'px) scale(' + size + ') perspective(360px) rotateY(-16deg) rotateZ(' + (-6 + rot) + 'deg)'
      : 'translate(' + x + 'px,' + y + 'px) scale(' + size + ') rotate(' + rot + 'deg)';
  }
}
function applyProductControls() {
  for (let i = 1; i <= 5; i++) {
    const img = document.querySelector('.fig' + i);
    if (!img || img.classList.contains('missing')) continue;
    const size = Number(g('product' + i + '_size') || 118) / 100;
    const x = Number(g('product' + i + '_x') || 0);
    const y = Number(g('product' + i + '_y') || 0);
    const rot = Number(g('product' + i + '_rot') || 0);
    const z = Number(g('product' + i + '_z') || (20 + i));
    img.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + size + ') rotate(' + rot + 'deg)';
    img.style.zIndex = z;
  }
}
applyLeftControls();
applyProductControls();
</script>
</body>
</html>
